<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steel Connection Detailer — SS EN 1993-1-8 / SSSS</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#1a1f26; --muted:#5a6573; --line:#c9d2dc;
  --accent:#1565c0; --accent2:#0d47a1; --tile:#f4f7fb; --tileSel:#1565c0;
  --err:#c62828; --warn:#e08600; --ok:#2e7d32; --paper:#ffffff;
  --steel:#2b3138; --plate:#37414b; --bolt:#222; --dim:#0a66c2; --weld:#7a1fa2;
}
body.dark{
  --bg:#11151a; --panel:#1a2027; --ink:#e7edf3; --muted:#93a1b0; --line:#2c3742;
  --accent:#4f9bff; --accent2:#2f7be0; --tile:#222b34; --tileSel:#2f7be0;
  --paper:#0f1318; --steel:#cfd8e0; --plate:#aeb9c4; --bolt:#dfe6ec; --dim:#5db0ff; --weld:#cf8bff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.4 "Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button,input,select{font:inherit;color:inherit}
#topbar{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative;z-index:5}
#topbar .ttl{font-weight:700;font-size:14px;white-space:nowrap}
#topbar .sub{color:var(--muted);font-size:12px;white-space:nowrap}
#topbar .spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--tile);padding:5px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--tile);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#app{display:flex;height:calc(100% - 46px)}
#panel{width:344px;min-width:344px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#panelScroll{overflow-y:auto;flex:1;padding:10px}
#stage{flex:1;display:flex;flex-direction:column;overflow:auto;padding:14px;gap:12px}
#views{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px;flex:1 1 460px;min-width:340px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
figure svg{display:block;width:100%;height:560px;background:var(--paper);border-radius:4px}
figcaption{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 2px;color:var(--muted);font-size:12px}
figcaption b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.fam{grid-column:1 / -1;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:6px 0 0;font-weight:700}
.tile{border:1px solid var(--line);background:var(--tile);border-radius:7px;padding:7px 8px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--accent)}
.tile.sel{background:var(--tileSel);color:#fff;border-color:var(--tileSel)}
.tile .id{font-weight:700;font-size:12px}
.tile .nm{font-size:10.5px;opacity:.85;line-height:1.25;margin-top:2px}
.acc{border:1px solid var(--line);border-radius:7px;margin-top:8px;overflow:hidden}
.acc>summary{cursor:pointer;padding:8px 10px;font-weight:600;background:var(--tile);list-style:none;display:flex;justify-content:space-between;align-items:center}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"▾";color:var(--muted)}
.acc[open]>summary::after{content:"▴"}
.acc .body{padding:8px 10px;display:grid;grid-template-columns:1fr 1fr;gap:7px 10px}
.fld{display:flex;flex-direction:column;gap:2px}
.fld.full{grid-column:1 / -1}
.fld label{font-size:11px;color:var(--muted)}
.fld .ico{font-size:10px;color:var(--accent);cursor:help}
.fld input,.fld select{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:var(--paper)}
.numwrap{display:flex;align-items:stretch}
.numwrap input{border-radius:5px 0 0 5px;border-right:0}
.numwrap .stp{display:flex;flex-direction:column;border:1px solid var(--line);border-left:0;border-radius:0 5px 5px 0}
.numwrap .stp button{border:0;background:var(--tile);cursor:pointer;line-height:1;padding:0 6px;font-size:9px;flex:1}
.numwrap .stp button:first-child{border-bottom:1px solid var(--line)}
.hint{grid-column:1/-1;font-size:11px;color:var(--muted);margin-top:-2px}
#validate{border-top:1px solid var(--line);max-height:38%;overflow-y:auto;padding:8px 10px;background:var(--panel)}
#validate h4{margin:0 0 6px;font-size:12px;display:flex;align-items:center;gap:8px}
.vbadge{font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700}
.vbadge.e{background:#fdecea;color:var(--err)} .vbadge.w{background:#fff4e0;color:var(--warn)} .vbadge.ok{background:#e8f5e9;color:var(--ok)}
body.dark .vbadge.e{background:#3a1c1c} body.dark .vbadge.w{background:#3a2e16} body.dark .vbadge.ok{background:#16331b}
.vitem{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px dashed var(--line);font-size:12px}
.vitem .code{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;padding:1px 5px;border-radius:4px;background:var(--tile);white-space:nowrap}
.vitem.e .code{color:var(--err)} .vitem.w .code{color:var(--warn)}
.vitem.ok{color:var(--muted)}
.vnote{font-size:11px;color:var(--muted);background:var(--tile);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:5px;padding:6px 8px;margin:2px 0 8px;line-height:1.4}
.vnote b{color:var(--ink)}
#titleStrip{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:700;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
#titleStrip .sep{color:var(--line)}
#titleStrip .muted{font-weight:500;color:var(--muted)}
#paramTableWrap{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px}
#paramTableWrap h3{margin:0 0 8px;font-size:13px}
table.pt{border-collapse:collapse;width:100%;font-size:12px}
table.pt td,table.pt th{border:1px solid var(--line);padding:4px 8px;text-align:left}
table.pt th{background:var(--tile);width:38%}
table.pt caption{caption-side:top;text-align:left;font-weight:700;margin-bottom:4px}
.svgwrap{position:relative}
/* SVG element classes (set via attributes too, but defaults here) */
svg text{font-family:"Segoe UI",Arial,sans-serif}
@media print{
  body{overflow:visible;background:#fff;color:#000}
  #topbar,#panel{display:none!important}
  #app{display:block;height:auto}
  #stage{display:block;overflow:visible;padding:0}
  #views{display:block}
  figure{break-inside:avoid;border:0;box-shadow:none;page-break-inside:avoid;width:100%}
  figure svg{height:auto}
  #paramTableWrap{break-before:auto;border:0}
}
</style>
</head>
<body>
<header id="topbar">
  <span class="ttl">Steel Connection Detailer</span>
  <span class="sub" id="connTitle">—</span>
  <span class="spacer"></span>
  <span class="seg" id="viewSeg">
    <button data-v="A">Elevation</button>
    <button data-v="B">Section</button>
    <button data-v="both" class="on">Both</button>
  </span>
  <button class="btn" id="btnTable">Param table</button>
  <button class="btn" id="btnSVG">Export SVG</button>
  <button class="btn" id="btnPNG">Export PNG</button>
  <button class="btn" id="btnSave">Save JSON</button>
  <button class="btn" id="btnLoad">Load JSON</button>
  <button class="btn" id="btnPrint">Print</button>
  <button class="btn" id="btnTheme" title="Toggle dark">◐</button>
  <input type="file" id="fileIn" accept="application/json" hidden>
</header>
<div id="app">
  <aside id="panel">
    <div id="panelScroll">
      <div class="tiles" id="tiles"></div>
      <div id="accordions"></div>
    </div>
    <div id="validate"></div>
  </aside>
  <main id="stage">
    <div id="views">
      <figure id="figA"><div class="svgwrap"><svg id="viewA" xmlns="http://www.w3.org/2000/svg"></svg></div><figcaption><span id="capA">Elevation</span><b id="scaleA"></b></figcaption></figure>
      <figure id="figB"><div class="svgwrap"><svg id="viewB" xmlns="http://www.w3.org/2000/svg"></svg></div><figcaption><span id="capB">Section / Plan</span><b id="scaleB"></b></figcaption></figure>
    </div>
    <div id="titleStrip"></div>
    <div id="paramTableWrap" hidden></div>
  </main>
</div>

/* =====================================================================
   §4 Custom section + section helpers
   ===================================================================== */
function secByName(name){
  if(name==="CUSTOM") return null;
  return SECTIONS.find(s=>s.name===name) || null;
}
// Resolve a member slot to the 5 numbers everything downstream consumes.
function resolveSec(name, custom){
  if(name==="CUSTOM"){
    const c = custom||{};
    return {name:"Custom I-section", type:"CUSTOM",
      h:+c.h||400, b:+c.b||180, tf:+c.tf||12, tw:+c.tw||8, r:+c.r||10,
      A_cm2:null, mass:null, custom:true};
  }
  const s = secByName(name);
  return s ? Object.assign({}, s) : resolveSec("CUSTOM", custom);
}
// Derived geometry §4
function clearDepth(s){ return s.h - 2*s.tf - 2*s.r; }        // d, flat web zone
function serialSize(s){ // for sorting: leading "DDDxWWW"
  const m = /(\d+)X(\d+)/i.exec(s.name||""); return m?[+m[1],+m[2]]:[0,0];
}
function sectionsByType(t){
  return SECTIONS.filter(s=>s.type===t).sort((a,b)=>{
    const [da,wa]=serialSize(a),[db,wb]=serialSize(b);
    return db-da || wb-wa || a.mass-b.mass;
  });
}

function defaultState(conn){
  conn = conn||"BB-FIN";
  const st = {conn, grade:"S355", drawScale:"auto", view:"both",
              showParamTable:false, theme:document.body.classList.contains("dark")?"dark":"light"};
  // every control gets its default so JSON is complete & round-trips
  for(const k in CONTROLS){
    const c = CONTROLS[k];
    st[k] = (c.def && typeof c.def==="object") ? JSON.parse(JSON.stringify(c.def)) : c.def;
  }
  const ovr = DEFOVR[conn]||{};
  for(const k in ovr) st[k] = ovr[k];
  return st;
}

const SVGNS = "http://www.w3.org/2000/svg";
// ---- primitive constructors (short, geometry code stays terse) ----
const Pr = {
  l:(x1,y1,x2,y2,c="out",o={})=>({t:"l",a:[x1,y1,x2,y2],c,...o}),

// style table: stroke/width(du)/fill/dash per class
const STY = {
  out:   {s:"var(--steel)", w:1.7, f:"none"},
  plate: {s:"var(--plate)", w:1.3, f:"none"},
  bolt:  {s:"var(--bolt)",  w:1.0, f:"none"},

/* ---- shape helpers: return arrays of primitives in mm (y-up) ---- */
// I cross-section outline (square inner corners), centred at (cx,cy). web vertical.
function iSectionPts(cx,cy,h,b,tf,tw){
  const X=v=>cx+v, Y=v=>cy+v, hh=h/2, hb=b/2, ww=tw/2, wi=hh-tf;
  return [
    [X(-hb),Y(hh)],[X(hb),Y(hh)],[X(hb),Y(wi)],[X(ww),Y(wi)],
    [X(ww),Y(-wi)],[X(hb),Y(-wi)],[X(hb),Y(-hh)],[X(-hb),Y(-hh)],
    [X(-hb),Y(-wi)],[X(-ww),Y(-wi)],[X(-ww),Y(wi)],[X(-hb),Y(wi)],
  ];
}
// I-section, web HORIZONTAL (flanges vertical) — used when a beam axis is horizontal in plan
function iSectionPtsH(cx,cy,h,b,tf,tw){
  // rotate the vertical one 90°: swap roles
  const X=v=>cx+v, Y=v=>cy+v, hh=h/2, hb=b/2, ww=tw/2, wi=hh-tf;
  return [
    [X(hh),Y(-hb)],[X(hh),Y(hb)],[X(wi),Y(hb)],[X(wi),Y(ww)],
    [X(-wi),Y(ww)],[X(-wi),Y(hb)],[X(-hh),Y(hb)],[X(-hh),Y(-hb)],
    [X(-wi),Y(-hb)],[X(-wi),Y(-ww)],[X(wi),Y(-ww)],[X(wi),Y(-hb)],
  ];
}
// Beam in side elevation (web face to viewer): outer rect + 2 inner flange lines.
// origin = (x0,yc) left end at mid-height; runs +x by len, depth h.
function beamElevH(x0,yc,len,h,tf,cls="out"){
  const t=h/2, x1=x0+len, top=yc+t, bot=yc-t, z=Math.min(8,h*0.03), out=[];
  out.push(Pr.l(x0,top,x1,top,cls,{w:1.9}));        // top flange outer
  out.push(Pr.l(x0,bot,x1,bot,cls,{w:1.9}));        // bottom flange outer
  out.push(Pr.l(x0,top,x0,bot,cls,{w:1.9}));        // near end face
  out.push(Pr.l(x0,top-tf,x1,top-tf,cls,{w:1.2}));  // top flange inner
  out.push(Pr.l(x0,bot+tf,x1,bot+tf,cls,{w:1.2}));  // bottom flange inner
  out.push(Pr.path([["M",x1,top],["L",x1,yc+h*0.16],["L",x1-z,yc+h*0.08],
                    ["L",x1+z,yc-h*0.08],["L",x1,yc-h*0.16],["L",x1,bot]],cls,{w:1.4})); // far-end break
  return out;
}
// Beam in elevation shown as a finite SEGMENT with break (cut) lines at both ends —
// reads as a continuous UB/UC: top flange = 2 lines, bottom flange = 2 lines, broken ends.
function beamElevBreak(xc,len,yc,h,tf,cls="out",opts={}){
  const x0=xc-len/2, x1=xc+len/2, t=h/2, top=yc+t, bot=yc-t, z=Math.min(8,h*0.03), out=[];
  out.push(Pr.l(x0,top,x1,top,cls));            // top flange outer
  if(!opts.noFlange){                            // flange inner lines (suppressed where a member is cut over them)
    out.push(Pr.l(x0,top-tf,x1,top-tf,cls,{w:1.0}));// top flange inner
    out.push(Pr.l(x0,bot+tf,x1,bot+tf,cls,{w:1.0}));// bottom flange inner
  }
  out.push(Pr.l(x0,bot,x1,bot,cls));            // bottom flange outer
  for(const xe of [x0,x1])                       // break line (zig) at each cut end
    out.push(Pr.path([["M",xe,top],["L",xe,yc+h*0.16],["L",xe-z,yc+h*0.08],
                      ["L",xe+z,yc-h*0.08],["L",xe,yc-h*0.16],["L",xe,bot]],cls,{w:1.0}));
  return out;
}
// bolt holes in elevation: grid n1(rows,vert) x n2(cols,horiz) centred at (cx,cy)
function boltGridElev(cx,cy,n1,n2,p1,p2,d0,tag){
  const out=[], cts=[]; const rr=d0/2;
  const y0 = cy + (n1-1)*p1/2, x0 = cx - (n2-1)*p2/2;
  for(let i=0;i<n1;i++)for(let j=0;j<n2;j++){
    const x=x0+j*p2, y=y0-i*p1; cts.push([x,y]);
    out.push(Pr.c(x,y,rr,"bolt",tag?{tag}:{}));
    const k=rr*0.55;
    out.push(Pr.l(x-k,y,x+k,y,"bolt",{w:0.8}));
    out.push(Pr.l(x,y-k,x,y+k,"bolt",{w:0.8}));
  }
  return {prims:out, centres:cts};
}
// bolt in side/section view passing horizontally through plies of total thickness g
// head on -x side (support) optional, nut+washer on +x. drawn to scale, simplified hex.
function boltSide(x, y, gripL, headSide, d, washer, opts={}){
  const out=[], dh=d*0.6, hw=washer*0.5, hL=d*0.8, nL=d*0.8, wL=d*0.18;
  // shank across grip
  const x0 = headSide==="left" ? x : x-gripL;
  out.push(Pr.l(x0, y-d/2, x0+gripL, y-d/2, "bolt"));
  out.push(Pr.l(x0, y+d/2, x0+gripL, y+d/2, "bolt"));
  // head end (left) & nut end (right) — place outside grip
  const headX = (headSide==="left") ? x0 : x0+gripL;
  const dir = (headSide==="left") ? -1 : 1;
  // washer
  out.push(Pr.r(headX, y-hw, dir*wL, 2*hw, "bolt"));
  // head/nut block (hex simplified as rect with chamfer lines)
  const hx = headX + dir*wL;
  out.push(Pr.r(hx, y-hw, dir*hL, 2*hw, "bolt"));
  // far end (nut) on the opposite side
  const farX = (headSide==="left") ? x0+gripL : x0;
  const fdir = -dir;
  out.push(Pr.r(farX, y-hw, fdir*wL, 2*hw, "bolt"));
  out.push(Pr.r(farX+fdir*wL, y-hw, fdir*nL, 2*hw, "bolt"));
  return out;
}
// small filled fillet-weld triangles along an edge (x1,y1)->(x2,y2), leg, side(+1/-1 normal)
function weldRun(x1,y1,x2,y2,leg,side=1,c="weld"){
  const out=[], dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy); if(L<1) return out;
  const ux=dx/L, uy=dy/L, nx=-uy*side, ny=ux*side;
  const step=Math.max(leg*1.6, L/Math.max(2,Math.round(L/(leg*1.8))));
  for(let s=0;s+leg*0.1<=L+0.1;s+=step){
    const bx=x1+ux*s, by=y1+uy*s;
    const p2=[bx+ux*leg, by+uy*leg], p3=[bx+nx*leg, by+ny*leg];
    out.push(Pr.poly([[bx,by],p2,p3],c,{close:true})); // fill from STY[c] (var(--weld))
  }
  return out;
}

/* ---------- bounding box over primitives (mm) ---------- */
function bboxOf(prims){

    arr.push(Pr.dim("v", x, ys[i], x, ys[i+1], off, String(Math.round(Math.abs(ys[i+1]-ys[i]))), tags?{tag:tags}:{}));
}
function chainH(arr, y, off, xs, tags){
  for(let i=0;i<xs.length-1;i++)
    arr.push(Pr.dim("h", xs[i], y, xs[i+1], y, off, String(Math.round(Math.abs(xs[i+1]-xs[i]))), tags?{tag:tags}:{}));
}
function dimV(arr,x,y1,y2,off,text,tag){ arr.push(Pr.dim("v",x,y1,x,y2,off,text!=null?text:String(Math.round(Math.abs(y2-y1))),tag?{tag}:{})); }
function dimH(arr,y,x1,x2,off,text,tag){ arr.push(Pr.dim("h",x1,y,x2,y,off,text!=null?text:String(Math.round(Math.abs(x2-x1))),tag?{tag}:{})); }
let LBLSEQ=0;
function label(arr,x,y,lines,o={}){
  lines=[].concat(lines); const g="g"+(++LBLSEQ);   // group id so a multi-line callout relaxes as one block
  lines.forEach((s,i)=>arr.push(Pr.txt(x,y - i*(o.lh||13)/ (o.sc||1),s,Object.assign({size:o.size||11,anchor:o.anchor||"start",c:"label",weight:o.weight||"normal",rot:o.rot||0,mm:true},o.extra,{grp:g}))));
}
function plCallout(t,L,H,grade){ return `PL ${Math.round(t)} × ${Math.round(L)} × ${Math.round(H)}, ${grade}`; }
function bCallout(n,size,grade,d0){ return `${n} No. ${size} Gr ${grade} in ${d0} dia holes`; }

/* supported-beam side elevation with optional top/bottom copes (notch). */
function beamElevNotched(x0, x1, yc, h, tf, notch, cls="out"){
  const top=yc+h/2, bot=yc-h/2, r=10, z=Math.min(8,h*0.03), out=[];
  const tN=notch&&notch.top, bN=notch&&notch.bot, segs=[];
  segs.push(["M", x1, top]);                              // far-top (terminated by break line)
  if(tN){ segs.push(["L", x0+tN.len, top]); segs.push(["L", x0+tN.len, top-tN.dep+r]);
          segs.push(["A", r, x0+tN.len-r, top-tN.dep, false]); segs.push(["L", x0, top-tN.dep]); }
  else  { segs.push(["L", x0, top]); }
  if(bN){ segs.push(["L", x0, bot+bN.dep]); segs.push(["L", x0+bN.len-r, bot+bN.dep]);
          segs.push(["A", r, x0+bN.len, bot+bN.dep-r, false]); segs.push(["L", x0+bN.len, bot]); }
  else  { segs.push(["L", x0, bot]); }
  segs.push(["L", x1, bot]);                              // bottom edge to far end (open)
  out.push(Pr.path(segs, cls, {w:1.9}));                  // bold beam outline
  // far-end break (cut) line — shows the beam continues; makes the elevation read as a beam
  out.push(Pr.path([["M",x1,top],["L",x1,yc+h*0.16],["L",x1-z,yc+h*0.08],
                    ["L",x1+z,yc-h*0.08],["L",x1,yc-h*0.16],["L",x1,bot]],cls,{w:1.4}));
  const tfTop=top-tf, tfBot=bot+tf;                       // flange inner lines (=> 2 lines per flange)
  out.push(Pr.l(tN?x0+tN.len:x0, tfTop, x1, tfTop, cls, {w:1.2}));
  out.push(Pr.l(bN?x0+bN.len:x0, tfBot, x1, tfBot, cls, {w:1.2}));
  return out;
}

/* ---- column elevation helper (BC-*) ---- */
/* column shown in elevation: rectangle (depth × length) with flange inner lines */
function columnElev(xRight, depth, length, tf, yc, cls="out"){
  const x0=xRight-depth, out=[];
  out.push(Pr.r(x0, yc-length/2, depth, length, cls));
  out.push(Pr.l(xRight-tf, yc-length/2, xRight-tf, yc+length/2, cls,{w:0.9}));
  out.push(Pr.l(x0+tf, yc-length/2, x0+tf, yc+length/2, cls,{w:0.9}));
  out.push(Pr.l(xRight, yc-length/2, xRight, yc+length/2, cls,{w:1.8}));      // support face
  return out;
}
function boltRowsY(n1,p1){ const ys=[],y0=(n1-1)*p1/2; for(let i=0;i<n1;i++)ys.push(y0-i*p1); return ys; }

/* ---- anchors / concrete helpers (BCON-*, CCON-*) ---- */
/* ===================== Anchors / concrete (§5.5) ===================== */
function anchorCallout(n,size,type,hef){ return `${n} No. ${size} ${type}, hₑf = ${hef}`; }
// anchor positions across a span given count, edge distance, optional fixed spacing
function anchorPos(span, n, c, fixed){
  if(n<=1) return [0];
  const s = fixed>0 ? fixed : (span-2*c)/(n-1);
  const tot=s*(n-1), out=[]; for(let i=0;i<n;i++) out.push(-tot/2 + i*s); return out;
}
// vertical anchor (base plate) tip pointing down
function anchorDown(arr, x, T, grout, hef, proj, d, type){
  const cTop=-T-grout, tip=cTop-hef, r=d/2;
  arr.push(Pr.l(x-r, proj, x-r, cTop, "bolt")); arr.push(Pr.l(x+r, proj, x+r, cTop, "bolt"));
  arr.push(Pr.l(x-r, cTop, x-r, tip, "hidden")); arr.push(Pr.l(x+r, cTop, x+r, tip, "hidden"));
  // nut + washer at top of plate
  arr.push(Pr.l(x-d*0.9, 2, x+d*0.9, 2, "bolt",{w:1.0}));
  arr.push(Pr.r(x-d*0.7, 2, d*1.4, d*0.7, "bolt"));
  if(type==="cast-in headed"||type==="headed studs"){
    arr.push(Pr.r(x-d*0.95, tip, d*1.9, d*0.5, "hidden"));            // head plate
  } else if(type==="cast-in J/L-bolt"){
    arr.push(Pr.path([["M",x-r,tip+d],["L",x-r,tip+r],["A",r+ d*0.0+ r, x+r, tip+r,false],["L",x+r,tip+d]],"hidden"));
  } else if(type==="post-installed chemical"){
    arr.push(Pr.hatch([[x-d,cTop],[x+d,cTop],[x+d,tip],[x-d,tip]],"grout",{edge:false}));   // bond zone
  } else if(type==="post-installed mechanical"){
    arr.push(Pr.l(x-r,tip+d,x-d,tip,"hidden")); arr.push(Pr.l(x+r,tip+d,x+d,tip,"hidden"));   // sleeve
  }
  return {tip,cTop};
}
// horizontal anchor/stud (embedded plate) pointing -x into concrete
function anchorLeft(arr, y, faceX, T, hef, d, type){
  const back=faceX-T, tip=back-hef, r=d/2;
  arr.push(Pr.l(faceX, y-r, back, y-r, "bolt")); arr.push(Pr.l(faceX, y+r, back, y+r, "bolt"));
  arr.push(Pr.l(back, y-r, tip, y-r, "hidden")); arr.push(Pr.l(back, y+r, tip, y+r, "hidden"));
  if(type==="headed studs"||type==="cast-in headed"){ arr.push(Pr.r(tip, y-d*0.95, d*0.5*( -1), d*1.9, "hidden")); arr.push(Pr.r(tip,y-d*0.95,-d*0.5,d*1.9,"hidden")); }
  else if(type==="post-installed chemical"){ arr.push(Pr.hatch([[back,y-d],[tip,y-d],[tip,y+d],[back,y+d]],"grout",{edge:false})); }
  return tip;
}
function concreteBlock(arr, cx, topY, W, H){
  arr.push(Pr.hatch([[cx-W/2,topY],[cx+W/2,topY],[cx+W/2,topY-H],[cx-W/2,topY-H]],"concrete",{edge:false}));
  arr.push(Pr.poly([[cx-W/2,topY],[cx+W/2,topY],[cx+W/2,topY-H],[cx-W/2,topY-H]],"out",{w:1.2}));
}

/* ---- beam-to-concrete shared setup (BCON-*) ---- */
/* ---------------- BCON-FIN / BCON-W : beam to concrete -------------- */
function bconCommon(st){
  const {sec}=members(), d=anchorDia(), hef=hefVal();
  const concT = st.concType==="wall"? st.wallT : Math.max(st.wallT,400);
  const Lp = st.Lp>0 ? st.Lp : Math.round(sec.h+120);
  const Bp = st.Bp>0 ? st.Bp : Math.round(sec.b+120);
  return {sec,d,hef,concT,Lp,Bp};
}

/* =====================================================================
   Double-sided BB framing — shared by BB-FIN / BB-EP / BB-W.
   A second supported beam (independent "…B" controls) frames into the far
   face of the supporting web; View B becomes its (mirrored) elevation. An
   optional full-depth stiffener can be added on the far web face.
   ===================================================================== */
// Map the independent far-beam controls (…B) onto a standard state. Supporting member shared.
function farBeamState(st){
  return Object.assign({}, st, {
    secSec:st.secSecB, secCustom:st.secCustomB,
    align:st.alignB, finPos:st.finPosB, notchMode:st.notchModeB, notchLen:0, notchDep:0,
    tp:st.tpB, hp:st.hpB, bp:st.bpB, g:st.gB, tep:st.tepB, w:st.wB,
    bolt:st.boltB, boltGrade:st.boltGradeB, n1:st.n1B, n2:st.n2B,
    p1:st.p1B, p2:st.p2B, e1:st.e1B, e2:st.e2B, hole:st.holeB,
    weldType:st.weldTypeB, weldLeg:st.weldLegB,
  });
}
// Horizontally mirror an elevation (about x=0): negate x; flip arc sweep, vertical-dim
// offsets, weld leaders, and start/end text anchors (text stays upright/left-to-right).
function mirrorX(prims){
  return prims.map(p=>{
    const q=Object.assign({},p);
    if(p.t==="l") q.a=[-p.a[0],p.a[1],-p.a[2],p.a[3]];
    else if(p.t==="r") q.x=-(p.x+p.w);
    else if(p.t==="c") q.cx=-p.cx;
    else if(p.t==="p"||p.t==="h") q.pts=p.pts.map(z=>[-z[0],z[1]]);
    else if(p.t==="pa") q.segs=p.segs.map(s=> s[0]==="A"?["A",s[1],-s[2],s[3],!s[4]] : s[0]==="Z"?s : [s[0],-s[1],s[2]]);
    else if(p.t==="t"){ q.x=-p.x; if(p.anchor==="start")q.anchor="end"; else if(p.anchor==="end")q.anchor="start"; }
    else if(p.t==="d"){ q.x1=-p.x1; q.x2=-p.x2; if(p.dir==="v")q.off=-(p.off||0); }
    else if(p.t==="w"){ q.x=-p.x; q.lx=-p.lx; }
    return q;
  });
}
// Full-depth stiffener on the far web face: flange to flange, fitted to the flange tip,
// fillet-welded all-round (far web face + both flange undersides).
function farStiffener(out, prim, ts, wleg){
  const sTop=prim.h/2-prim.tf, sBot=-(prim.h/2-prim.tf), xWeb=-prim.tw, xTip=-(prim.b+prim.tw)/2;
  out.push(Pr.r(xTip, sBot, xWeb-xTip, sTop-sBot, "plate"));
  out.push(...weldRun(xWeb, sBot, xWeb, sTop, wleg, -1));   // far web-face weld
  out.push(...weldRun(xTip, sTop, xWeb, sTop, wleg, 1));    // top-flange weld
  out.push(...weldRun(xTip, sBot, xWeb, sBot, wleg, -1));   // bottom-flange weld
  label(out, xTip, sTop+14, "stiffener PL "+Math.round(ts)+" — full depth, welded all round", {anchor:"start", size:10});
}
// Compose the two BB views: A = near elevation (+ far stiffener); B = mirrored far-beam
// elevation when a far beam is enabled, otherwise the connection's own section view.
function bbDoubleSided(st, elevFn, sectFn){
  const A = elevFn(st, {stiff: st.farStiff, tag: st.beam2 ? "near, side 1" : "supported"});
  const B = st.beam2 ? mirrorX(elevFn(farBeamState(st), {tag:"far, side 2"})) : sectFn(st, {stiff: st.farStiff});
  return {A, B};
}

/* =====================================================================
   GEOMETRY registry.  Each connection file attaches GEO[id] = fn(state).
   ===================================================================== */
const GEO = {};
/* ===== connections/BB-EP.js ============================================ */
/* ---------------- BB-EP : Beam-to-beam bolted end plate ------------- */
// End-plate ELEVATION (supporting SECTION + supported beam in elevation, end plate edge-on),
// parameterised by `st` so it draws either the near beam or the independent far beam.
function epElevation(st, opts){
  opts = opts||{};
  const out=[], eg=epGeom(st), {sec,prim,hp,yc,ys,bpw,d0}=eg;
  const notch = notchAuto(st, sec, prim);
  const Lsec=Math.max(sec.h*1.0,360), tep=st.tep, g=st.g, wleg=Math.max(st.weldLeg,4);
  const iP=iSectionPts(-prim.tw/2,0,prim.h,prim.b,prim.tf,prim.tw);
  out.push(Pr.hatch(iP,"steel",{edge:false})); out.push(Pr.poly(iP,"out"));
  label(out,-(prim.b+prim.tw)/2-6,0,prim.name+"  (main)",{anchor:"middle",rot:-90,weight:"bold"});
  if(opts.stiff) farStiffener(out, prim, st.ts, wleg);    // optional full-depth far-side stiffener
  // end plate edge-on, bolted to main web at x=g..g+tep, beam beyond
  out.push(Pr.r(g, yc-hp/2, tep, hp, "plate"));
  out.push(...beamElevNotched(g+tep, g+tep+Lsec, yc, sec.h, sec.tf, notch, "out"));
  for(const y of ys) out.push(Pr.l(0, y, g+tep, y, "hidden",{tag:"bolts"}));        // bolt shanks into web
  out.push(Pr.weld(g+tep, yc+sec.h/2-sec.tf, g+tep+70, yc+sec.h/2+30,{kind:st.weldType,size:st.weldLeg,both:true,text:"typ."}));
  chainV(out, g+tep, -((prim.b+prim.tw)/2+32+g+tep), [yc+hp/2].concat(ys).concat([yc-hp/2]).sort((p,q)=>q-p), "p1");
  dimV(out, g+tep+Lsec, yc-sec.h/2, yc+sec.h/2, 34, String(Math.round(sec.h)));
  label(out, g+tep+Lsec*0.5, yc+sec.h/2+30, sec.name+"  ("+(opts.tag||"supported")+")",{anchor:"middle",weight:"bold"});
  label(out, g+tep+8, yc-hp/2-8, [plCallout(tep,bpw,hp,st.grade), bCallout(2*st.n1,st.bolt,st.boltGrade,d0)],{lh:13});
  return out;
}

// End-plate FACE (View B): main beam in elevation + end plate face with two bolt columns.
function epSection(st, opts){
  opts = opts||{};
  const out=[], eg=epGeom(st), {sec,prim,hp,yc,ys,bpw,d0}=eg;
  const half=st.w/2, Lmain=Math.max(bpw+280, 440);
  out.push(...beamElevBreak(0,Lmain,0,prim.h,prim.tf,"out",{noFlange:true}));           // supporting beam (no flange inner lines beside the cut)
  if(opts.stiff) out.push(Pr.r(-st.ts, -(prim.h/2-prim.tf), st.ts, prim.h-2*prim.tf, "plate", {dash:"6,4"})); // far stiffener (hidden)
  // supported beam shown as a cut SECTION (hatched), matching BB-FIN / BB-W View B
  const iS=iSectionPts(0,yc,sec.h,sec.b,sec.tf,sec.tw);
  out.push(Pr.poly(iS,"fillonly",{fill:"var(--paper)"}));                               // white mask over the supporting beam behind
  out.push(Pr.poly(iS,"fillonly",{fill:"url(#hatchSteel)"}));                           // section hatch
  out.push(Pr.poly(iS,"out",{w:1.9}));                                                  // bold cut outline
  out.push(Pr.r(-bpw/2, yc-hp/2, bpw, hp, "plate", {fill:"var(--paper)"}));             // end plate face (opaque — clean bolt face over the beam)
  for(const y of ys){ for(const sx of [-half,half]){ out.push(Pr.c(sx,y,d0/2,"bolt",{tag:"bolts"}));
     out.push(Pr.l(sx-d0*0.35,y,sx+d0*0.35,y,"bolt",{w:0.8})); out.push(Pr.l(sx,y-d0*0.35,sx,y+d0*0.35,"bolt",{w:0.8})); } }
  dimH(out, yc+hp/2+20, -half, half, 16, String(st.w), "w");
  chainV(out, -bpw/2, -34, [yc+hp/2].concat(ys).concat([yc-hp/2]).sort((p,q)=>q-p), "p1");
  dimV(out, -Lmain/2-22, -prim.h/2, prim.h/2, -16, String(Math.round(prim.h)));
  label(out, 0, Math.max(yc+hp/2, prim.h/2)+40, [plCallout(st.tep,bpw,hp,st.grade), bCallout(2*st.n1,st.bolt,st.boltGrade,d0)],{lh:14,anchor:"middle"});
  label(out, 0, -prim.h/2-12, prim.name+"  (main)",{anchor:"middle",weight:"bold"});
  return out;
}

GEO["BB-EP"] = function(st){ return bbDoubleSided(st, epElevation, epSection); };
/* ===== connections/BB-FIN.js =========================================== */
/* ---------------- BB-FIN : Beam-to-beam fin plate ------------------- */
// One-sided fin-plate ELEVATION: supporting SECTION + supported beam in elevation (bolts as
// holes). Parameterised by `st`, so it draws either the near beam or the independent far beam.
// opts.stiff -> add the full-depth far-side stiffener; opts.tag -> beam label suffix.
function finElevation(st, opts){
  opts = opts||{};
  const out=[], fg=finGeom(st), {sec,prim,bp,yc,ys,xs,baseX,ftip,outside,plCy,plH,d0}=fg;
  const notch = notchAuto(st, sec, prim);            // "none" when outside (no cope)
  const g = st.g, Lsec = Math.max(sec.h*1.0, 360);
  const bgx = xs[0] + (st.n2-1)*st.p2/2;             // bolt group centre x
  const xb0 = baseX + g;                             // secondary beam end (gap g from reference face)
  const wleg = Math.max(st.weldLeg, 4);
  const plTop = plCy + plH/2, plBot = plCy - plH/2;  // fin plate top / bottom edges
  // "outside" plate is full depth at the support but must be cropped where it overlaps the
  // supported beam, so it does not foul that beam's flange(s) (per SCI/detailing practice).
  const topU = yc + sec.h/2 - sec.tf, botU = yc - sec.h/2 + sec.tf;   // supported flange undersides
  const cropTop = outside ? Math.min(plTop, topU) : plTop;
  const cropBot = outside ? Math.max(plBot, botU) : plBot;
  const cropped = outside && (plTop-cropTop>0.5 || cropBot-plBot>0.5);

  // main/supporting beam shown as a cut I-section, web right face at x=0
  const iP = iSectionPts(-prim.tw/2, 0, prim.h, prim.b, prim.tf, prim.tw);
  out.push(Pr.hatch(iP,"steel",{edge:false})); out.push(Pr.poly(iP,"out"));
  label(out, -(prim.b+prim.tw)/2-6, 0, prim.name+"  (main)", {anchor:"middle", rot:-90, weight:"bold"});
  if(opts.stiff) farStiffener(out, prim, st.ts, wleg);   // optional full-depth far-side stiffener

  // fin plate welded to main web (all-around web + both flanges when "outside"), projecting right.
  // Full depth at the support; cropped past the beam end (x>=xb0) to clear the supported flange(s).
  if(cropped)
    out.push(Pr.poly([[0,plTop],[xb0,plTop],[xb0,cropTop],[bp,cropTop],[bp,cropBot],[xb0,cropBot],[xb0,plBot],[0,plBot]],"plate"));
  else
    out.push(Pr.r(0, plBot, bp, plH, "plate"));
  out.push(...weldRun(0, plBot, 0, plTop, wleg, 1));                  // web weld (full plate height)
  if(outside){
    out.push(...weldRun(0, plTop, ftip, plTop, wleg, 1));            // top-flange weld
    out.push(...weldRun(0, plBot, ftip, plBot, wleg, -1));           // bottom-flange weld
  }
  out.push(Pr.weld(0, plTop-12, ftip+50, plTop+30, {kind:st.weldType, size:st.weldLeg, both:true, allAround:outside, text:outside?"all round":"typ."}));
  out.push(...beamElevNotched(xb0, xb0+Lsec, yc, sec.h, sec.tf, notch, "out"));
  const bg = boltGridElev(bgx, yc, st.n1, st.n2, st.p1, st.p2, d0, "bolts"); out.push(...bg.prims);

  // dimensions
  chainV(out, xs[0], -((prim.b+prim.tw)/2 + 32 + xs[0]), [cropTop].concat(ys).concat([cropBot]).sort((p,q)=>q-p), "p1");
  dimV(out, xb0+Lsec, yc-sec.h/2, yc+sec.h/2, 34, String(Math.round(sec.h)));
  dimH(out, yc-sec.h/2-26, baseX, baseX+g, -20, String(g), "gap");
  if(outside) dimH(out, plTop+22, 0, ftip, 18, String(Math.round(ftip)), "proj"); // plate cantilever over the flange
  if(st.n2>1) chainH(out, plTop+(outside?40:22), 18, xs, "p2");
  if(notch.top){ dimH(out, yc+sec.h/2+18, xb0, xb0+notch.top.len, 16, String(notch.top.len), "notch");
                 dimV(out, xb0+notch.top.len+8, yc+sec.h/2, yc+sec.h/2-notch.top.dep, 22, String(notch.top.dep), "notch"); }
  label(out, xb0+Lsec*0.5, yc+sec.h/2+30, sec.name+"  ("+(opts.tag||"supported")+")", {anchor:"middle", weight:"bold"});
  label(out, bp+12, plBot-6, [plCallout(st.tp,bp,plH,st.grade)+(outside?(cropped?"  (welded all round; cropped to clear flange)":"  (welded all round)"):""),
        bCallout(st.n1*st.n2, st.bolt, st.boltGrade, d0)], {lh:14});
  return out;
}

// SECTION: supporting beam in elevation + supported beam cut as a cross-section + bolt side-views.
// opts.stiff -> show the far-side stiffener (hidden, behind the web).
function finSection(st, opts){
  opts = opts||{};
  const out=[], fg=finGeom(st), {sec,prim,b,yc,ys,outside,plCy,plH,pyHalf}=fg;
  const wleg = Math.max(st.weldLeg, 4);
  const plTop = plCy + plH/2, plBot = plCy - plH/2;
  const scx = st.tp + sec.tw/2;
  const Lmain = Math.max(sec.b + 300, 440);
  out.push(...beamElevBreak(scx, Lmain, 0, prim.h, prim.tf, "out"));     // main beam in elevation (broken segment)
  // optional full-depth stiffener on the far face (behind the web in this view), flange to flange
  if(opts.stiff) out.push(Pr.r(-st.ts, -pyHalf, st.ts, 2*pyHalf, "plate", {dash:"6,4"}));
  // fin plate seen edge-on at main web near face (full depth + all-around weld when outside)
  out.push(Pr.hatch([[0,plBot],[st.tp,plBot],[st.tp,plTop],[0,plTop]],"steel",{edge:false}));
  out.push(Pr.r(0, plBot, st.tp, plH, "plate"));
  out.push(...weldRun(0, plBot, 0, plTop, wleg, 1));                  // web weld
  if(outside){
    out.push(...weldRun(0, plTop, st.tp, plTop, wleg, 1));           // top-flange weld (section)
    out.push(...weldRun(0, plBot, st.tp, plBot, wleg, -1));          // bottom-flange weld (section)
  }
  // supported beam SECTION (cut) — masks the main beam behind it, hatched, bold outline
  const iS = iSectionPts(scx, yc, sec.h, sec.b, sec.tf, sec.tw);
  out.push(Pr.poly(iS,"fillonly",{fill:"var(--paper)"}));      // white mask over main beam
  out.push(Pr.poly(iS,"fillonly",{fill:"url(#hatchSteel)"}));  // section hatch (on top of mask)
  out.push(Pr.poly(iS,"out",{w:1.9}));                         // bold cut outline
  for(const y of ys) out.push(...boltSide(0, y, st.tp+sec.tw, "left", b.d, b.washer));
  // dims
  if(st.n1>1) chainV(out, scx, sec.b/2+34, [plTop].concat(ys).concat([plBot]).sort((p,q)=>q-p), "p1");
  dimV(out, scx-Lmain/2-22, -prim.h/2, prim.h/2, -16, String(Math.round(prim.h)));
  out.push(Pr.weld(0, plBot+10, st.tp+60, plBot-30, {kind:st.weldType, size:st.weldLeg, both:true, allAround:outside, text:outside?"all round":"typ."}));
  label(out, scx, prim.h/2+34, prim.name+"  (main)", {anchor:"middle", weight:"bold"});
  label(out, scx, prim.h/2+16, sec.name+"  (supported)", {anchor:"middle", size:10});
  return out;
}

/* ---------------- BB-W : Beam-to-beam direct welded ----------------- */
// Direct-welded ELEVATION (supporting SECTION + supported beam welded in elevation),
// parameterised by `st` so it draws either the near beam or the independent far beam.
function wElevation(st, opts){
  opts = opts||{};
  const out=[], {sec,prim}=members(st);
  const notch=notchAuto(st,sec,prim), Lsec=Math.max(sec.h*1.0,360);
  const yc=alignYc(st.align||"top",prim,sec), fkind=st.weldType, top=yc+sec.h/2, bot=yc-sec.h/2;
  const ftip=(prim.b-prim.tw)/2, wleg=Math.max(st.weldLeg,4);
  const iP=iSectionPts(-prim.tw/2,0,prim.h,prim.b,prim.tf,prim.tw);
  out.push(Pr.hatch(iP,"steel",{edge:false})); out.push(Pr.poly(iP,"out"));
  label(out,-(prim.b+prim.tw)/2-6,0,prim.name+"  (main)",{anchor:"middle",rot:-90,weight:"bold"});
  if(opts.stiff) farStiffener(out, prim, st.ts, wleg);    // optional full-depth far-side stiffener
  out.push(...beamElevNotched(0, Lsec, yc, sec.h, sec.tf, notch, "out"));
  out.push(Pr.weld(0, top-sec.tf/2, ftip+40, top+34,{kind:fkind,size:st.weldLeg,both:false,text:"flange"}));
  out.push(Pr.weld(0, bot+sec.tf/2, ftip+40, bot-34,{kind:fkind,size:st.weldLeg,both:false,text:"flange"}));
  out.push(Pr.weld(0, yc, 90, yc+60,{kind:"fillet",size:st.weldLeg,both:true,text:"web"}));
  out.push(...weldRun(0,bot+sec.tf,0,top-sec.tf,wleg,1));
  dimV(out,Lsec,bot,top,34,String(Math.round(sec.h)));
  label(out,Lsec*0.5,top+30,sec.name+"  ("+(opts.tag||"welded")+")",{anchor:"middle",weight:"bold"});
  return out;
}

// Direct-welded SECTION (View B): main beam in elevation + supported beam cut + web stiffeners.
function wSection(st, opts){
  opts = opts||{};
  const out=[], {sec,prim}=members(st);
  const yc=alignYc(st.align||"top",prim,sec), fkind=st.weldType, top=yc+sec.h/2, bot=yc-sec.h/2;
  const scx=sec.tw/2, Lmain=Math.max(sec.b+320, 460);
  out.push(...beamElevBreak(scx,Lmain,0,prim.h,prim.tf,"out",{noFlange:true})); // no flange inner lines beside the cut section
  // transverse stiffeners on the main web aligned to the supported beam flanges (pair)
  if(st.ts>0){ for(const yy of [yc+sec.h/2-sec.tf/2, yc-sec.h/2+sec.tf/2])
      out.push(Pr.r(scx-Lmain*0.36, yy-st.ts/2, Lmain*0.72, st.ts, "plate"));
    label(out,scx-Lmain*0.36-6, yc, "stiff "+st.ts, {anchor:"middle",rot:-90,size:9}); }
  const iS=iSectionPts(scx,yc,sec.h,sec.b,sec.tf,sec.tw);
  out.push(Pr.poly(iS,"fillonly",{fill:"var(--paper)"}));
  out.push(Pr.poly(iS,"fillonly",{fill:"url(#hatchSteel)"}));
  out.push(Pr.poly(iS,"out",{w:1.9}));
  const wl=Math.max(st.weldLeg,4);
  out.push(...weldRun(0, bot, 0, top, wl, 1));                       // web weld
  out.push(...weldRun(scx-sec.b/2, top, scx+sec.b/2, top, wl, -1)); // top-flange weld
  out.push(...weldRun(scx-sec.b/2, bot, scx+sec.b/2, bot, wl, 1));  // bottom-flange weld
  out.push(Pr.weld(0, top-6, 70, top+30,{kind:fkind,size:st.weldLeg,both:true,allAround:true,text:"all round"}));
  dimV(out,scx+sec.b/2+30,bot,top,30,String(Math.round(sec.h)));
  dimV(out,scx-Lmain/2-22,-prim.h/2,prim.h/2,-16,String(Math.round(prim.h)));
  label(out,scx,prim.h/2+18,prim.name+"  (main)",{anchor:"middle",weight:"bold"});
  return out;
}

/* ---------------- BC-EP : Beam to column, end plate ----------------- */
GEO["BC-EP"] = function(st){
  const A=[], B=[], {sec,prim}=members(), b=boltProps(), d0=holeDia();
  const ext = st.epMode==="extended";
  const hp = st.hp>0 ? st.hp : (st.n1-1)*st.p1 + 2*st.e1 + (ext? st.p1*0.6:0);
  const ys=boltRowsY(st.n1,st.p1), g=st.g, Lsec=Math.max(sec.h*1.0,360);
  const tep=st.tep, colLen=Math.max(sec.h*1.9,sec.h+360), half=st.w/2;
  const bpw=st.w+2*Math.max(st.e2,1.5*b.d);
  const epTop = ext? sec.h/2+st.e1 : sec.h/2, epBot=-sec.h/2-( ext?0:0);
  const epH = epTop-(-(sec.h/2)); // simple: end plate roughly beam depth (+ext above)

  /* View A : elevation */
  A.push(...columnElev(0,prim.h,colLen,prim.tf,0));
  label(A,-prim.h-6,0,prim.name,{anchor:"middle",rot:-90,weight:"bold"});
  const plTop= ext? sec.h/2+st.e1 : sec.h/2, plBot=-sec.h/2;
  A.push(Pr.r(g, plBot, tep, plTop-plBot, "plate"));
  A.push(...beamElevH(g+tep,0,Lsec,sec.h,sec.tf,"out"));
  for(const y of ys) A.push(Pr.c(g+tep*0.5,y,d0/2,"hidden",{tag:"bolts"}));
  A.push(Pr.weld(g+tep, sec.h/2-sec.tf, g+tep+70, sec.h/2+30,{kind:st.weldType,size:st.weldLeg,both:true,text:"typ."}));
  chainV(A,g+tep,-(prim.h+40),[plTop].concat(ys).concat([plBot]).sort((p,q)=>q-p),"p1");
  dimV(A,g+tep+Lsec,-sec.h/2,sec.h/2,34,String(Math.round(sec.h)));
  dimV(A,g,plTop,plBot,-(prim.h+70),String(Math.round(plTop-plBot)));
  label(A,g+tep+Lsec*0.5,sec.h/2+30,sec.name+"  (beam)",{anchor:"middle",weight:"bold"});

  /* View B : plan */
  const iC=iSectionPtsH(-prim.h/2,0,prim.h,prim.b,prim.tf,prim.tw);
  B.push(Pr.hatch(iC,"steel",{edge:false})); B.push(Pr.poly(iC,"out"));
  B.push(Pr.r(0,-bpw/2,tep,bpw,"plate"));                     // end plate edge-on (plan)
  B.push(Pr.r(tep,-sec.b/2,Lsec,sec.b,"out"));                 // beam top-flange in plan
  B.push(Pr.l(tep,-sec.tw/2,tep+Lsec,-sec.tw/2,"out",{w:0.9})); B.push(Pr.l(tep,sec.tw/2,tep+Lsec,sec.tw/2,"out",{w:0.9}));
  for(const sx of [-half,half]) B.push(...boltSide(-prim.tf*0+ -10, sx, tep+prim.tf+10, "left", b.d, b.washer));
  dimV(B,-prim.h-20,-half,half,-16,String(st.w),"w");
  label(B,tep+Lsec*0.5,sec.b/2+18,sec.name+"  (beam)",{anchor:"middle",weight:"bold"});
  label(B,0,bpw/2+30,[plCallout(tep,bpw,Math.round(plTop-plBot),st.grade),bCallout(2*st.n1,st.bolt,st.boltGrade,d0)],{lh:14,anchor:"middle"});
  return {A,B};
};

/* ---------------- BC-FIN : Beam to column, fin plate ---------------- */
GEO["BC-FIN"] = function(st){
  const A=[], B=[], {sec,prim}=members(), b=boltProps(), d0=holeDia();
  const major = st.axis==="major";
  const la = st.bp>0 ? Math.max(st.bp-st.e2-(st.n2-1)*st.p2,20) : Math.max(50,2*b.d);
  const bp = st.bp>0 ? st.bp : la+(st.n2-1)*st.p2+st.e2;
  const hp = st.hp>0 ? st.hp : (st.n1-1)*st.p1+2*st.e1;
  const ys=boltRowsY(st.n1,st.p1), g=st.g, Lsec=Math.max(sec.h*1.0,360);
  const colLen=Math.max(sec.h*1.9, sec.h+360), bgx=la+(st.n2-1)*st.p2/2;

  /* View A : elevation */
  A.push(...columnElev(0, prim.h, colLen, prim.tf, 0));
  label(A,-prim.h-6,0,prim.name+(major?" (major)":" (minor)"),{anchor:"middle",rot:-90,weight:"bold"});
  A.push(Pr.r(0,-hp/2,bp,hp,"plate"));
  A.push(...beamElevH(g,0,Lsec,sec.h,sec.tf,"out"));
  const bg=boltGridElev(bgx,0,st.n1,st.n2,st.p1,st.p2,d0,"bolts"); A.push(...bg.prims);
  A.push(Pr.weld(0,hp/2-15,-prim.h-30,hp/2+40,{kind:st.weldType,size:st.weldLeg,both:true,text:"typ."}));
  A.push(...weldRun(0,-hp/2,0,hp/2,Math.max(st.weldLeg,4),1));
  chainV(A, la, -(la+prim.h+34), [hp/2].concat(ys).concat([-hp/2]).sort((p,q)=>q-p), "p1");
  dimV(A,g+Lsec,-sec.h/2,sec.h/2,34,String(Math.round(sec.h)));
  dimH(A,-sec.h/2-26,0,g,-20,String(g),"gap");
  if(st.n2>1) chainH(A,hp/2+22,18,bg.centres.slice(0,st.n2).map(c=>c[0]),"p2");
  label(A,g+Lsec*0.5,sec.h/2+30,sec.name+"  (beam)",{anchor:"middle",weight:"bold"});
  label(A,bp+12,-hp/2-6,[plCallout(st.tp,bp,hp,st.grade),bCallout(st.n1*st.n2,st.bolt,st.boltGrade,d0)],{lh:14});

  /* View B : plan (looking down) */
  if(major){
    const iC=iSectionPtsH(-prim.h/2,0,prim.h,prim.b,prim.tf,prim.tw);
    B.push(Pr.hatch(iC,"steel",{edge:false})); B.push(Pr.poly(iC,"out"));
  } else {
    const iC=iSectionPts(-prim.h/2,0,prim.h,prim.b,prim.tf,prim.tw); // web faces beam
    B.push(Pr.hatch(iC,"steel",{edge:false})); B.push(Pr.poly(iC,"out"));
  }
  // fin plate (plan: strip of thickness tp offset from beam web)
  B.push(Pr.hatch([[0,sec.tw/2],[bp,sec.tw/2],[bp,sec.tw/2+st.tp],[0,sec.tw/2+st.tp]],"steel",{edge:false}));
  B.push(Pr.r(0,sec.tw/2,bp,st.tp,"plate"));
  // beam in plan (top flange width b, web centreline)
  B.push(Pr.r(g,-sec.b/2,Lsec,sec.b,"out"));
  B.push(Pr.l(g,-sec.tw/2,g+Lsec,-sec.tw/2,"out",{w:0.9})); B.push(Pr.l(g,sec.tw/2,g+Lsec,sec.tw/2,"out",{w:0.9}));
  for(const cx of (st.n2>1?[la,la+(st.n2-1)*st.p2]:[la])) B.push(...boltSide(cx, sec.tw/2+st.tp, st.tp+sec.tw, "left", b.d, b.washer));
  B.push(...weldRun(0,sec.tw/2,bp,sec.tw/2,Math.max(st.weldLeg,4),-1));
  dimV(B,-prim.h-20,-prim.b/2,prim.b/2,-16,String(Math.round(prim.b)));
  dimH(B,-sec.b/2-22,0,g,-16,String(g),"gap");
  label(B,g+Lsec*0.5,sec.b/2+18,sec.name+"  (beam)",{anchor:"middle",weight:"bold"});
  label(B,-prim.h/2,prim.b/2+16,prim.name,{anchor:"middle",weight:"bold"});
  return {A,B};
};

/* ---------------- BC-W : Beam to column, welded moment -------------- */
GEO["BC-W"] = function(st){
  const A=[], B=[], {sec,prim}=members(), Lsec=Math.max(sec.h*1.0,380);
  const colLen=Math.max(sec.h*2.0,sec.h+420);
  /* View A : elevation */
  A.push(...columnElev(0,prim.h,colLen,prim.tf,0));
  label(A,-prim.h-6,0,prim.name,{anchor:"middle",rot:-90,weight:"bold"});
  A.push(...beamElevH(2,0,Lsec,sec.h,sec.tf,"out"));
  const top=sec.h/2, bot=-sec.h/2;
  A.push(Pr.weld(2,top-sec.tf/2,-prim.h-30,top+34,{kind:st.weldType,size:st.weldLeg,both:false,text:"flange FPBW"}));
  A.push(Pr.weld(2,bot+sec.tf/2,-prim.h-30,bot-34,{kind:st.weldType,size:st.weldLeg,both:false,text:"flange FPBW"}));
  A.push(Pr.weld(2,0,2+90,60,{kind:"fillet",size:st.weldLeg,both:true,text:"web"}));
  // column stiffeners opposite beam flanges (continuity plates) - shown as hidden behind flange
  for(const yy of [top-sec.tf/2,bot+sec.tf/2]) A.push(Pr.l(-prim.h+prim.tf,yy,-prim.tf,yy,"hidden"));
  dimV(A,2+Lsec,bot,top,34,String(Math.round(sec.h)));
  label(A,2+Lsec*0.5,top+30,sec.name+"  (beam)",{anchor:"middle",weight:"bold"});

  /* View B : plan */
  const iC=iSectionPtsH(-prim.h/2,0,prim.h,prim.b,prim.tf,prim.tw);
  B.push(Pr.hatch(iC,"steel",{edge:false})); B.push(Pr.poly(iC,"out"));
  // continuity stiffeners (pair) inside column aligned to beam flanges
  if(st.ts>0){
    B.push(Pr.r(-prim.h/2+prim.tf, -sec.b/2, prim.h-2*prim.tf, st.ts,"plate"));
    label(B,-prim.h/2,sec.b/2+14,"continuity PL "+st.ts,{anchor:"middle",size:9});
  }
  // doubler plate on column web
  if(st.doubler){ B.push(Pr.r(-st.doublerT-prim.tw/2,-sec.b/2*0.8,st.doublerT,sec.b*0.8,"plate"));
    label(B,-prim.h/2-14,0,"doubler "+st.doublerT,{anchor:"middle",rot:-90,size:9}); }
  B.push(Pr.r(0,-sec.b/2,Lsec,sec.b,"out"));
  B.push(Pr.l(0,-sec.tw/2,Lsec,-sec.tw/2,"out",{w:0.9})); B.push(Pr.l(0,sec.tw/2,Lsec,sec.tw/2,"out",{w:0.9}));
  B.push(Pr.weld(0,sec.b/2-2,70,sec.b/2+30,{kind:st.weldType,size:st.weldLeg,both:false,text:"FPBW"}));
  dimV(B,-prim.h-20,-prim.b/2,prim.b/2,-16,String(Math.round(prim.b)));
  label(B,Lsec*0.5,sec.b/2+18,sec.name+"  (beam)",{anchor:"middle",weight:"bold"});
  return {A,B};
};

GEO["BCON-FIN"] = function(st){
  const A=[], B=[], cc=bconCommon(st), {sec,d,hef,concT,Lp,Bp}=cc, bolt=boltProps(), d0=holeDia();
  const la=st.bp>0?Math.max(st.bp-st.e2-(st.n2-1)*st.p2,20):Math.max(50,2*bolt.d);
  const bp=st.bp>0?st.bp:la+(st.n2-1)*st.p2+st.e2, hp=st.hp>0?st.hp:(st.n1-1)*st.p1+2*st.e1;
  const ys=boltRowsY(st.n1,st.p1), g=st.g, Lsec=Math.max(sec.h*1.0,360), Hc=Math.max(st.concH,Lp+200);
  const T=st.T;
  /* View A : elevation */
  concreteBlock(A, -concT/2, Hc/2, concT, Hc);             // concrete to the left, face at x=0
  A.push(Pr.r(-T,-Lp/2,T,Lp,"plate"));                      // embedded plate (flush, body in concrete)
  // anchors/studs into concrete
  const aty=anchorPos(Lp,Math.max(2,st.na1),st.ca,st.sa1);
  for(const y of aty) anchorLeft(A, y, 0, T, hef, d, st.anchorType);
  A.push(Pr.r(0,-hp/2,bp,hp,"plate"));                      // fin plate
  A.push(...weldRun(0,-hp/2,0,hp/2,Math.max(st.weldLeg,4),1));
  A.push(...beamElevH(g,0,Lsec,sec.h,sec.tf,"out"));
  const bg=boltGridElev(la+(st.n2-1)*st.p2/2,0,st.n1,st.n2,st.p1,st.p2,d0,"bolts"); A.push(...bg.prims);
  chainV(A,la,-(la+T+40),[hp/2].concat(ys).concat([-hp/2]).sort((p,q)=>q-p),"p1");
  dimV(A,g+Lsec,-sec.h/2,sec.h/2,34,String(Math.round(sec.h)));
  dimH(A,-Lp/2-26,-T-hef,0,-18,"hₑf="+hef,"hef");
  label(A,g+Lsec*0.5,sec.h/2+30,sec.name+"  (beam)",{anchor:"middle",weight:"bold"});
  label(A,-concT/2,Hc/2+16,(st.concType==="wall"?"RC wall":"RC column"),{anchor:"middle",weight:"bold"});
  label(A,bp+12,-hp/2-6,[plCallout(st.tp,bp,hp,st.grade),bCallout(st.n1*st.n2,st.bolt,st.boltGrade,d0),
        anchorCallout(aty.length*Math.max(1,st.na2),st.anchorSize,st.anchorType,hef)],{lh:13});
  /* View B : embedded plate face (anchor layout + fin + bolt holes) */
  B.push(Pr.r(-Bp/2,-Lp/2,Bp,Lp,"plate"));
  const axs=anchorPos(Bp,Math.max(2,st.na2),st.ca,st.sa2), ays=anchorPos(Lp,Math.max(2,st.na1),st.ca,st.sa1);
  for(const ax of axs)for(const ay of ays){ B.push(Pr.c(ax,ay,d/2,"bolt",{tag:"anchor"})); B.push(Pr.c(ax,ay,d*0.9,"hidden")); }
  // fin plate outline on face + bolt holes
  B.push(Pr.r(-st.tp/2, -hp/2, st.tp, hp, "plate"));
  for(const y of ys) B.push(Pr.c(0,y,d0/2,"hidden",{tag:"bolts"}));
  if(axs.length>1) chainH(B,-Lp/2-20,-16,axs,"sa2"); if(ays.length>1) chainV(B,-Bp/2-20,-16,ays,"sa1");
  dimH(B,Lp/2+18,-Bp/2,Bp/2,16,String(Bp),"Bp"); dimV(B,Bp/2+18,-Lp/2,Lp/2,16,String(Lp),"Lp");
  label(B,0,Lp/2+52,plCallout(T,Bp,Lp,st.grade)+"  (embedded)",{anchor:"middle",weight:"bold"});
  return {A,B};
};

GEO["CCON-BP"] = GEO["CCON-BP-S"] = function(st){

  A.push(Pr.hatch([[-Bp/2,0],[Bp/2,0],[Bp/2,-T],[-Bp/2,-T]],"steel",{edge:false}));
  A.push(Pr.r(-Bp/2,-T,Bp,T,"plate"));

  dimV(A,-Bp/2-30,0,-T,-18,"T"+T,"T");
  dimV(A,-Bp/2-30,-T,-T-grout,-18,String(grout),"grout");
  if(xs.length) dimV(A, xs[xs.length-1]+34, -T-grout, tipInfo.tip, 24, "hₑf="+hef, "hef");
  dimV(A, xs[0]-24, st.proj, 0, -16, String(st.proj),"proj");

/* ===== core/20-validate.js ============================================= */
/* =====================================================================
   §6  VALIDATION engine  ->  [{level, code, msg, tags}]
   Detailing / buildability rules only — no capacity (see Capacity stub).
   Clause basis: hole positioning  EN 1993-1-8 §3.5 Table 3.3;
   weld ductility  EN 1993-1-8 §4.5.3 + Table 4.1;
   fit-up & buildability  SSSS (Liew 2019) / SCI P358.
   ===================================================================== */
function validate(st){
  const out=[], {sec,prim}=members(), conn=st.conn;
  const add=(level,code,msg,tags)=>out.push({level,code,msg,tags:tags||[]});
  const fin=conn.endsWith("FIN"), ep=conn.endsWith("EP"), bolted=fin||ep;
  const anchors=conn.startsWith("BCON")||conn.startsWith("CCON");
  if(bolted){
    const d0=holeDia(), bd=boltProps().d;
    const t = fin ? Math.min(st.tp, sec.tw) : Math.min(st.tep, prim.tw||st.tep);
    // Full-strength leg/tₚ for a double fillet to out-develop the plate's tension
    // yield (simplified method, EN 1993-1-8 §4.5.3.3 + β_w Table 4.1, fu per
    // EN 10025-2): S275 → 0.87, S355 → 1.04. A flat 0.8 is grade-blind and ~23 %
    // short on S355 (the default grade), so the weld can rupture before the plate yields.
    const kWeld = st.grade==="S355" ? 1.04 : 0.87;
    // §6.1 / EN 1993-1-8 §3.5 Table 3.3 — hole-positioning minima (errors)
    if(st.e1 < 1.2*d0) add("error","E-E1MIN",`e₁ = ${st.e1} < 1.2·d₀ = ${(1.2*d0).toFixed(1)}`,["e1"]);
    if(fin && st.e2 < 1.2*d0) add("error","E-E2MIN",`e₂ = ${st.e2} < 1.2·d₀ = ${(1.2*d0).toFixed(1)}`,["e2"]);
    if(st.p1 < 2.2*d0) add("error","E-P1MIN",`p₁ = ${st.p1} < 2.2·d₀ = ${(2.2*d0).toFixed(1)}`,["p1"]);
    if(fin && st.n2>1 && st.p2 < 2.4*d0) add("error","E-P2MIN",`p₂ = ${st.p2} < 2.4·d₀ = ${(2.4*d0).toFixed(1)}`,["p2"]);
    if(ep && st.w < 2.4*d0) add("error","E-WMIN",`w = ${st.w} < 2.4·d₀ = ${(2.4*d0).toFixed(1)}`,["w"]);
    // §6.1 / EN 1993-1-8 §3.5 Table 3.3 — maxima (warn)
    const eMax=4*t+40, pMax=Math.min(14*t,200);
    if(st.e1>eMax) add("warn","W-E1MAX",`e₁ = ${st.e1} > 4t+40 = ${eMax}`,["e1"]);
    if(fin && st.e2>eMax) add("warn","W-E2MAX",`e₂ = ${st.e2} > 4t+40 = ${eMax}`,["e2"]);
    if(st.p1>pMax) add("warn","W-P1MAX",`p₁ = ${st.p1} > min(14t,200) = ${pMax}`,["p1"]);
    if(fin && st.n2>1 && st.p2>pMax) add("warn","W-P2MAX",`p₂ = ${st.p2} > min(14t,200) = ${pMax}`,["p2"]);
    // §6.2 fit-up: bolt group within clear web depth d of supported beam
    //   (detailing convention — SCI P358 / SSSS, not a numbered EC3 clause)
    const dz=clearDepth(sec), grp=(st.n1-1)*st.p1 + 2*st.e1;
    if(grp > dz+1) add("error","E-FITDEPTH",`bolt group height ${Math.round(grp)} exceeds clear web depth d = ${Math.round(dz)} of ${sec.name}`,["bolts","p1"]);
    // §6.3 buildability / ductility (SSSS, SCI P358) (warn)
    if(fin && st.tp > 0.5*bd) add("warn","W-DUCT",`tₚ = ${st.tp} > 0.5·d_bolt = ${0.5*bd}; verify short-fin-plate ductility per SCI P358`,["tp"]);
    if(fin && st.weldLeg < kWeld*st.tp) add("warn","W-WELDLEG",`fin weld s = ${st.weldLeg} < ${kWeld}·tₚ = ${(kWeld*st.tp).toFixed(1)} (${st.grade}: plate must yield before weld)`,["weld"]);
    if(fin && st.conn==="BB-FIN" && st.finPos==="outside"){
      const la = st.bp>0 ? Math.max(st.bp - st.e2 - (st.n2-1)*st.p2, 20) : Math.max(50, 2*bd);
      const lever = Math.round((prim.b-prim.tw)/2 + la + (st.n2-1)*st.p2/2);   // support face → bolt group
      add("warn","W-FINEXT",`outside (extended) fin plate, welded all-round to web + both flanges: lever arm support → bolt group ≈ ${lever} mm — verify per SSSS (long fin plate)`,["tp","bp"]);
    }
    // far beam (side 2): EC3-1-8 §3.5 minima + fit-up on the independent far connection (BB-FIN/EP)
    if(st.beam2 && (st.conn==="BB-FIN"||st.conn==="BB-EP")){
      const stB=farBeamState(st), d0B=holeDia(stB), secB=members(stB).sec;
      if(st.e1B < 1.2*d0B) add("error","E-E1MIN-F",`far beam e₁ = ${st.e1B} < 1.2·d₀ = ${(1.2*d0B).toFixed(1)}`,["e1B"]);
      if(st.p1B < 2.2*d0B) add("error","E-P1MIN-F",`far beam p₁ = ${st.p1B} < 2.2·d₀ = ${(2.2*d0B).toFixed(1)}`,["p1B"]);
      if(fin && st.n2B>1 && st.p2B < 2.4*d0B) add("error","E-P2MIN-F",`far beam p₂ = ${st.p2B} < 2.4·d₀ = ${(2.4*d0B).toFixed(1)}`,["p2B"]);
      if(ep && st.wB < 2.4*d0B) add("error","E-WMIN-F",`far beam w = ${st.wB} < 2.4·d₀ = ${(2.4*d0B).toFixed(1)}`,["wB"]);
      const dzB=clearDepth(secB), grpB=(st.n1B-1)*st.p1B + 2*st.e1B;
      if(grpB > dzB+1) add("error","E-FITDEPTH-F",`far beam bolt group ${Math.round(grpB)} exceeds clear web depth ${Math.round(dzB)} of ${secB.name}`,["p1B"]);
      if(fin && st.weldLegB < kWeld*st.tpB) add("warn","W-WELDLEG-F",`far weld s = ${st.weldLegB} < ${kWeld}·tₚ = ${(kWeld*st.tpB).toFixed(1)} (${st.grade}: plate must yield before weld)`,["weldB"]);
    }
    if(active("g") && st.g < 10) add("warn","W-GAPMIN",`gap g = ${st.g} < 10 mm recommended (SSSS)`,["gap"]);
    if(st.n1 < 2) add("warn","W-NMIN","minimum 2 bolt rows recommended",["bolts"]);
    if(ep){ const bpw=st.w+2*Math.max(st.e2,1.5*bd);
      if(prim.b && bpw>prim.b) add("warn","W-EPWIDTH",`end-plate width ${Math.round(bpw)} > supporting flange width ${prim.b}`,["w"]); }
  }
  if(anchors){
    const d=anchorDia();
    if(st.ca < 6*d) add("warn","W-ANCHEDGE",`anchor edge c = ${st.ca} < 6·d = ${6*d} (verify edge distance — placeholder)`,["anchor","c"]);
    if(hefVal() < 8*d) add("warn","W-HEFMIN",`hₑf = ${hefVal()} < 8·d = ${8*d} — shallow embedment`,["hef"]);
  }
  // A 4 mm fillet leg is a fabrication-practice floor — EN 1993-1-8 §4.5.2 sets a 3 mm
  // minimum throat, not a 4 mm leg — so this is a buildability warning, not a code error.
  if(active("weldLeg") && st.weldLeg < 4) add("warn","W-WELDMIN",`fillet leg ${st.weldLeg} < 4 mm fabrication-practice floor (EN 1993-1-8 §4.5.2: 3 mm min throat)`,["weld"]);
  if(st.conn.startsWith("BB") && st.beam2 && st.weldLegB < 4) add("warn","W-WELDMIN-F",`far weld leg ${st.weldLegB} < 4 mm fabrication-practice floor`,["weldB"]);
  if(!out.length) add("ok","OK","All detailing checks pass.",[]);
  return out;
}

  // valid was chosen. oninput only commits complete, real section names so partial typing
  // never trashes the live drawing.
  inp.onfocus=()=>{ prev=state[key]; inp.placeholder=prev; inp.value=""; };
  inp.onblur=()=>{ if(!valid(inp.value.trim().toUpperCase())){ state[key]=prev; inp.value=prev; redrawD(); } };
  inp.onchange=()=>{ const v=inp.value.trim().toUpperCase(); state[key]=valid(v)?v:prev; buildPanel(); redraw(); };
  inp.oninput=()=>{ const v=inp.value.trim().toUpperCase(); if(valid(v)){ state[key]=v; redrawD(); } };
  if(state[key]==="CUSTOM"){
    const ck=key==="secSec"?"secCustom":key==="secSecB"?"secCustomB":"primCustom", cv=state[ck];
    const grid=el("div",{class:"fld full",style:"display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px"},frag);
    for(const f of ["h","b","tf","tw","r"]){ const w=el("div",{},grid); el("label",{text:f,style:"font-size:10px"},w);
      const ii=el("input",{type:"number",value:cv[f],step:f==="r"?0.5:1,style:"width:100%"},w);
      ii.oninput=()=>{ cv[f]=parseFloat(ii.value)||0; redrawD(); }; }
  }
  return frag;
}
function buildPanel(){
  const box=document.getElementById("accordions"); box.innerHTML="";
  // global group
  const gWrap=el("details",{class:"acc",open:""},box); el("summary",{text:"Global"},gWrap);
  const gBody=el("div",{class:"body"},gWrap);
  const gradeF=el("div",{class:"fld"},gBody); el("label",{text:"Steel grade"},gradeF);
  const gs=el("select",{},gradeF); for(const o of ["S275","S355"]){const op=el("option",{value:o,text:o},gs); if(state.grade==o)op.selected=true;} gs.onchange=()=>{state.grade=gs.value;redraw();};
  const scF=el("div",{class:"fld"},gBody); el("label",{text:"Drawing scale"},scF);
  const ss=el("select",{},scF); for(const o of [["auto","auto"],["5","1:5"],["10","1:10"],["20","1:20"]]){const op=el("option",{value:o[0],text:o[1]},ss); if(String(state.drawScale)==o[0])op.selected=true;} ss.onchange=()=>{state.drawScale=ss.value;redraw();};
  // connection groups
  const keys=SCHEMA[state.conn]||[]; const groups=[];
  for(const k of keys){ const c=CONTROLS[k]; if(!c||c.hidden) continue; const g=c.group;
    let grp=groups.find(x=>x.g===g); if(!grp){grp={g,keys:[]};groups.push(grp);} grp.keys.push(k); }
  for(const grp of groups){
    const acc=el("details",{class:"acc",open:""},box); el("summary",{text:grp.g},acc);
    const body=el("div",{class:"body"},acc);
    for(const k of grp.keys){ const c=CONTROLS[k];
      // conditional visibility
      if(k==="doublerT" && !state.doubler) continue;
      if(k==="wallT" && state.concType!=="wall") continue;
      if((k==="notchMode"||k==="notchLen"||k==="notchDep"||k==="hp") && state.conn==="BB-FIN" && state.finPos==="outside") continue;
      if(c.group===G.FAR && !state.beam2) continue;                               // far-beam controls only when 2nd beam on
      if(k==="ts" && !state.farStiff && (state.conn==="BB-FIN"||state.conn==="BB-EP")) continue; // stiffener thk only when far stiffener on (BB-W has its own ts)
      if((k==="notchModeB"||k==="hpB") && state.conn==="BB-FIN" && state.finPosB==="outside") continue;  // outside far plate: no cope / auto depth
      if((k==="sa1"||k==="sa2")) {/* keep */}
      const f=el("div",{class:"fld"+(c.type==="section"?" full":"")},body);
      const lab=el("label",{},f); lab.textContent=c.label; if(c.hint){ const ic=el("span",{class:"ico",title:c.hint,text:" ⓘ"}); lab.appendChild(ic); }
      let ctl;
      if(c.type==="number") ctl=numField(k);
      else if(c.type==="enum") ctl=enumField(k);
      else if(c.type==="bool") ctl=boolField(k);
      else if(c.type==="section") ctl=sectionField(k);
      f.appendChild(ctl);
    }
  }
}

const Capacity = { boltShear:()=>null, plateBearing:()=>null, weldResistance:()=>null, run:()=>null }; // stub boundary

function resolveVars(s){ const cs=getComputedStyle(document.documentElement);
  return s.replace(/var\((--[a-zA-Z0-9_]+)\)/g,(m,n)=>(cs.getPropertyValue(n).trim()||"#000")); }
function standaloneSVG(){
  const svgA=document.getElementById("viewA"), svgB=document.getElementById("viewB");
  const showA=state.view!=="B", showB=state.view!=="A";
  const parts=[]; let W=0,H=0, gap=20;
  if(showA){ const vb=svgA.getAttribute("viewBox").split(" ").map(Number); parts.push({svg:svgA,w:vb[2],h:vb[3]}); }
  if(showB){ const vb=svgB.getAttribute("viewBox").split(" ").map(Number); parts.push({svg:svgB,w:vb[2],h:vb[3]}); }
  const vH=Math.max(...parts.map(p=>p.h)); W=parts.reduce((a,p)=>a+p.w,0)+gap*(parts.length-1);
  const strip=34; H=vH+strip;
  let inner="", x=0;
  for(const p of parts){ inner+=`<g transform="translate(${x},0)">`+p.svg.innerHTML+`</g>`; x+=p.w+gap; }
  // §7 title strip: connection ID + members + date, report-ready
  const cd=CONN[state.conn], scl=document.getElementById("scaleA").textContent||"";
  const title=`${state.conn} — ${cd.name}    ${memberSummary()}    ${state.grade}    ${new Date().toISOString().slice(0,10)}    Scale ${scl}`;
  const footer=`<g transform="translate(0,${vH})"><rect x="0" y="0" width="${W}" height="${strip}" fill="#ffffff" stroke="#1a1f26" stroke-width="0.8"/>`
    +`<text x="10" y="22" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#1a1f26">${title.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</text></g>`;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`
       +`<rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>`+inner+footer+`</svg>`;
  return resolveVars(s);
}
function download(name, blob){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function exportSVG(){ download(state.conn+".svg", new Blob([standaloneSVG()],{type:"image/svg+xml"})); }
function exportPNG(){
  const s=standaloneSVG(), img=new Image();
  const m=/width="(\d+(?:\.\d+)?)" height="(\d+(?:\.\d+)?)"/.exec(s); const W=+m[1],H=+m[2], sc=2;
  img.onload=()=>{ const cv=document.createElement("canvas"); cv.width=W*sc; cv.height=H*sc; const ctx=cv.getContext("2d");
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height); ctx.scale(sc,sc); ctx.drawImage(img,0,0);
    cv.toBlob(b=>download(state.conn+"@2x.png",b),"image/png"); };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
}
function exportJSON(){ download(state.conn+".json", new Blob([JSON.stringify(state,null,2)],{type:"application/json"})); }
function importJSON(file){ const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result);
  if(!o.conn||!SCHEMA[o.conn]) throw new Error("unrecognised connection id"); state=Object.assign(defaultState(o.conn),o);
  document.body.classList.toggle("dark",state.theme==="dark"); buildTiles(); buildPanel(); redraw();
  }catch(e){ alert("Load failed: "+e.message); } }; r.readAsText(file); }

function bindTopbar(){
  document.getElementById("viewSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
    state.view=b.dataset.v; [...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b)); redraw(); });
  document.getElementById("btnTable").onclick=()=>{ state.showParamTable=!state.showParamTable;
    const w=document.getElementById("paramTableWrap"); if(state.showParamTable)renderParamTable(); else w.hidden=true; };
  document.getElementById("btnSVG").onclick=exportSVG;
  document.getElementById("btnPNG").onclick=exportPNG;
  document.getElementById("btnSave").onclick=exportJSON;
  document.getElementById("btnLoad").onclick=()=>document.getElementById("fileIn").click();
  document.getElementById("fileIn").onchange=e=>{ if(e.target.files[0])importJSON(e.target.files[0]); e.target.value=""; };
  document.getElementById("btnPrint").onclick=()=>{ if(!state.showParamTable){state.showParamTable=true;renderParamTable();} window.print(); };
  document.getElementById("btnTheme").onclick=()=>{ document.body.classList.toggle("dark"); state.theme=document.body.classList.contains("dark")?"dark":"light"; redraw(); };
}
function buildDatalists(){
  const ukb=sectionsByType("UKB"), ukc=sectionsByType("UKC");
  const mk=(id,first,second)=>{ const dl=el("datalist",{id},document.body);
    el("option",{value:"CUSTOM",label:"Custom I-section"},dl);
    for(const s of first) el("option",{value:s.name,label:`${s.type} ${s.mass}kg/m`},dl);
    for(const s of second) el("option",{value:s.name,label:`${s.type} ${s.mass}kg/m`},dl); };
  mk("dlBeam",ukb,ukc); mk("dlCol",ukc,ukb);
}

  buildDatalists(); buildTiles(); buildPanel(); bindTopbar();
  window.addEventListener("resize", debounce(()=>{ if(state.drawScale==="auto") redraw(); },120));
  redraw();
}
